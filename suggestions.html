<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAPD Suggestions</title>

<link rel="stylesheet" href="style.css">
<script src="portal-ui.js" defer></script>

</head>

<body>

<div class="page-layout">

<header class="simple-header">

<h1>SAPD Suggestions</h1>

<p>

Submit suggestions directly to department command staff.

</p>
<div class="last-updated">Last updated June 8, 2026</div>

</header>

<section class="page-card">

<form id="suggestionForm">

<div class="form-group">

<label>

Officer Name

<span class="required">*</span>

</label>

<input id="officerName" required>

</div>


<div class="form-group">

<label>

Badge Number

<span class="required">*</span>

</label>

<input id="badge" required>

</div>


<div class="form-group">

<label>

Suggestion Category

<span class="required">*</span>

</label>

<select id="category">

<option>Department Policy</option>

<option>Training</option>

<option>Equipment</option>

<option>Roster / Personnel</option>

<option>Operations</option>

<option>General Suggestion</option>

<option>Other</option>

</select>

</div>


<div class="form-group">

<label>

Suggestion Details

<span class="required">*</span>

</label>

<textarea id="details" rows="7" required></textarea>

</div>


<div class="form-group">

<label>

Urgency Level

<span class="required">*</span>

</label>

<select id="urgency">

<option>Low</option>

<option>Medium</option>

<option>High</option>

<option>Critical</option>

</select>

</div>


<div class="form-group">

<label>

Contact Method (Optional)

</label>

<input id="contact" placeholder="Discord, email, or preferred contact method">

</div>


<button class="submit-btn">

Submit Suggestion

</button>

</form>


<div id="successMessage"></div>

</section>

<a class="back-button" href="index.html">

← Return Home

</a>

</div>

<script src="suggestions.js"></script>

</body>

</html>
